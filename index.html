<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fc" />
  <title>投资决策水平测试 · 测完有点扎心</title>
  <meta name="description" content="10 道题测出你的投资决策水平，顺便被狠狠点评一下。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-default">
  <main class="container">
    <section id="quiz" class="card">
      <header class="quiz-top">
        <h1>投资决策水平测试</h1>
        <p class="subtitle">10 道题 · 按真实想法作答 · 全部答完后底部按钮解锁</p>
      </header>
      <div class="sticky-head">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <p class="progress-text">
          已答 <span id="answered-count">0</span> / <span id="total-count">10</span>
        </p>
      </div>
      <div id="questions-list" class="questions-list"></div>
      <div class="quiz-footer">
        <p id="unanswered-hint" class="unanswered-hint"></p>
        <button id="submit-btn" class="primary-btn block-btn" disabled>查看结果</button>
      </div>
    </section>

    <section id="result" class="card hidden">
      <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
      <h2 id="result-title"></h2>
      <p id="result-tagline" class="tagline"></p>
      <div id="result-description" class="description"></div>
      <div class="result-actions">
        <button id="retry-btn" class="primary-btn">再测一次</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>仅供自测参考，不构成任何投资建议。测完记得善待自己。</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
