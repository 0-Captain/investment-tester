<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投资决策水平测试</title>
  <meta name="description" content="10 道题测出你的投资决策水平，看看你是投机赌徒还是价值投资大师。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section id="intro" class="card">
      <h1>投资决策水平测试</h1>
      <p class="subtitle">10 道题，3 分钟，帮你定位自己的投资决策层级。</p>
      <ul class="hint-list">
        <li>覆盖风险认知、投资理念、情绪管理、资产配置、决策纪律</li>
        <li>按你的真实想法作答，而非"标准答案"</li>
        <li>测试完成后给出等级标题与针对性描述</li>
      </ul>
      <button id="start-btn" class="primary-btn">开始测试</button>
    </section>

    <section id="quiz" class="card hidden">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <div class="progress-text">
        <span id="progress-current">1</span> / <span id="progress-total">10</span>
      </div>
      <h2 id="question-text"></h2>
      <div id="options" class="options"></div>
      <div class="quiz-footer">
        <button id="prev-btn" class="ghost-btn" disabled>上一题</button>
        <button id="next-btn" class="primary-btn" disabled>下一题</button>
      </div>
    </section>

    <section id="result" class="card hidden">
      <div class="score-ring">
        <span id="score-number">0</span>
        <span class="score-unit">分</span>
      </div>
      <h2 id="result-title"></h2>
      <p id="result-tagline" class="subtitle"></p>
      <div id="result-description" class="description"></div>
      <div class="result-actions">
        <button id="retry-btn" class="primary-btn">再测一次</button>
        <button id="share-btn" class="ghost-btn">复制结果</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>仅供自测参考，不构成任何投资建议。</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
